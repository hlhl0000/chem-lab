<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개체군 변동과 생태계평형</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* 색은 shared/style.css 토큰만(풀·토끼·여우 그림은 실물색 — 그림 모듈). 요소 선택자 금지(§12①) · 루트 토큰 재선언 금지 */
  .page{padding:18px 16px 40px}   /* 좌우 16px 은 .wrap 의 여백을 살린 것(.page 가 덮어 0이 되던 것 — 390 폭 실측) */
  .head h1{font-size:22px; margin:0 0 4px; color:var(--t1)}
  .head .sub{color:var(--t2); font-size:14px; margin:0; line-height:1.6}
  .tabrow{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-top:14px}
  .tabs{display:flex; gap:8px; flex-wrap:wrap}
  .tabb{font-family:inherit; font-size:14px; font-weight:600; padding:10px 14px; min-height:44px; border-radius:10px 10px 0 0;
    border:1px solid var(--line); border-bottom:none; background:#eef2f7; color:var(--t2); cursor:pointer}
  .tabb[aria-pressed="true"]{background:var(--panel); color:var(--accent-dark); box-shadow:inset 0 3px 0 var(--accent)}
  .tabb.locked{opacity:.6}
  .bdg{display:inline-block; font-size:11px; border-radius:5px; padding:0 5px; margin-left:6px; color:#fff; background:var(--d-gray); vertical-align:middle}
  .bdg.ok{background:var(--d-green)}
  .tools{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap}
  .tabdesc{font-size:12.5px; color:var(--t2); line-height:1.65; margin:8px 0 0; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:10px 12px}
  .cols{display:grid; grid-template-columns:minmax(0,2fr) minmax(290px,1fr); gap:14px; margin-top:12px}
  @media(max-width:1023px){ .cols{grid-template-columns:1fr} }
  .tv .cols{grid-template-columns:1fr}
  .tv .head h1{font-size:30px} .tv .mbar{font-size:20px} .tv .q, .tv .clues li{font-size:17px}
  .card h2{font-size:14px; margin:0 0 8px; color:var(--t1)}
  .mbar{display:flex; gap:10px; align-items:center; background:var(--stage-dark); color:#fff; border-radius:10px; padding:8px 12px; margin-bottom:8px; font-size:14px; line-height:1.5}
  .mbar b{color:var(--p-yellow); white-space:nowrap}
  .stage{position:relative; border-radius:12px; overflow:hidden; background:#cfe6f3}
  .cv{display:block; width:100%; height:470px}
  .tv .cv{height:600px}
  @media(max-width:1023px){ .cv{height:400px} }
  @media(max-width:600px){ .cv{height:320px} }
  .mini{position:absolute; right:10px; bottom:10px; width:30%; border:2px solid #fff; border-radius:10px; overflow:hidden; box-shadow:var(--shadow-lg); background:#cfe6f3}
  .mini canvas{display:block; width:100%; height:120px}
  .gmini{position:absolute; left:10px; bottom:10px; width:clamp(150px, 34%, 340px); background:rgba(255,255,255,.94); border-radius:10px; padding:4px 4px 2px; box-shadow:var(--shadow-lg); pointer-events:none}
  .gmini svg{display:block; width:100%; height:auto}
  .rq{font-size:14px; font-weight:700; color:var(--t1); margin:12px 0 6px}
  .tv .rq{font-size:17px}
  .mini span{position:absolute; left:6px; top:4px; font-size:11px; font-weight:700; color:#fff; background:rgba(15,23,42,.75); border-radius:5px; padding:0 6px}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 0}
  .btn{font-family:inherit; font-size:14px; font-weight:600; padding:9px 13px; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--t2); cursor:pointer}
  .btn.pri{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn.warn{border-color:var(--d-amber); color:var(--d-amber)}
  .btn[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.sm{min-height:44px; padding:6px 10px; font-size:13px}
  .seg{display:inline-flex; gap:4px; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; padding:3px; background:#f3f5f8}
  .seg .btn{border:none}
  .toast{font-size:13px; font-weight:600; color:var(--d-amber); min-height:20px; margin-top:6px}
  .toast.ok{color:var(--d-green)}
  .q{font-size:13.5px; color:var(--t1); line-height:1.6; margin:0 0 6px}
  .q.small{font-size:12.5px; color:var(--t2)}
  .hint{font-size:12px; color:var(--t3); font-weight:400}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px}
  .chip{font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:var(--panel); color:var(--t2); min-height:44px; cursor:pointer}
  .chip.on{border-color:var(--accent); color:var(--accent-dark); font-weight:700; background:#eef4ff}
  .vgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:6px 0}
  .note{background:#fffdf3; border:1px solid #eadfb8; border-radius:12px; padding:12px 14px; margin-top:10px}
  .note h2{display:flex; justify-content:space-between; align-items:center; font-size:14px; margin:0 0 8px; color:var(--t1)}   /* 결과 창(.card 밖)에서도 같은 크기 */
  .cnt{font-size:12px; color:#fff; background:var(--d-gray); border-radius:999px; padding:1px 9px}
  .cnt.ok{background:var(--d-green)}
  .clues{list-style:none; margin:8px 0 0; padding:0}
  .clues li{display:flex; gap:8px; align-items:flex-start; font-size:13.5px; line-height:1.5; padding:6px 0; border-top:1px dashed #e6dcbc; color:var(--t3)}
  .clues .mk{flex:0 0 22px; height:22px; border-radius:50%; border:2px dashed #cdbf91; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700}
  .clues li.got{color:var(--t1)} .clues li.got .mk{background:var(--d-green); border:2px solid var(--d-green); color:#fff}
  .clues .tm{margin-left:auto; font-size:12px; color:var(--t3); white-space:nowrap}
  .done{margin:8px 0 0; font-size:13px; font-weight:700; color:var(--d-green)}
  .concl{margin:8px 0 0; border:1px dashed var(--line); border-radius:8px; padding:8px; font-size:12.5px; color:var(--t2)}
  .gcard{margin-top:12px}
  .gr svg{display:block; width:100%; height:auto}
  .flash{color:var(--d-amber); font-weight:700; font-size:12.5px; margin-left:8px}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--t2); margin:6px 0 0}
  .legend i{display:inline-block; width:22px; height:0; border-top:3px solid; vertical-align:middle; margin-right:4px}
  .limits{margin:0; padding-left:22px; font-size:13px; color:var(--t2); line-height:1.7}
  .ovl{position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:70; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:30px 12px}
  .obox{background:var(--panel); border-radius:14px; max-width:1100px; width:100%; padding:16px}
  .obox img{width:100%; border-radius:10px; display:block}
  .two{display:grid; grid-template-columns:1.3fr 1fr; gap:12px; margin-top:10px}
  @media(max-width:1023px){ .two{grid-template-columns:1fr} }
  .is-hidden{display:none!important}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
  .bars{max-width:620px; margin-top:10px}
  .brow{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:14px}
  .brow .bl{flex:0 0 10.5em; text-align:right; color:var(--t2)}
  .brow .bt{flex:1 1 auto; display:flex; align-items:center; gap:6px; min-width:0}
  .brow .bf{display:inline-block; height:18px; border-radius:3px; background:var(--d-blue)}
  .brow .bf.base{background:var(--t3)}
  .brow b{white-space:nowrap; color:var(--t1)}
  .bnote{font-size:12px; color:var(--t3); margin:4px 0 0}
  .barsh{font-size:13px; margin:0 0 4px; color:var(--t1)}
  .page [hidden]{display:none!important}   /* .btnrow·.seg 의 display 가 hidden 속성을 덮지 않게 */
</style>
</head>
<body>
<div class="wrap page">

<div class="head">
  <h1>개체군 변동과 생태계평형</h1>
  <p class="sub">풀·토끼·여우의 수가 어떻게 변하는지 보며 생태계평형을 알아봅니다.</p>
</div>

<div class="tabrow">
  <div class="tabs" id="tabs" role="group" aria-label="미션"></div>
  <div class="tools">
    <button type="button" class="btn sm" id="unlock">모든 미션 열기(교사)</button>
    <button type="button" class="btn sm" id="tvbtn" aria-pressed="false">TV로 크게</button>
  </div>
</div>
<p class="tabdesc" id="tabdesc"></p>

<div class="cols">
  <div class="card">
    <div class="mbar" id="mbar"></div>
    <div class="stage">
      <canvas class="cv" id="cv" role="img" aria-label="풀·토끼·여우가 사는 섬"></canvas>
      <div class="gmini" id="gmini"></div>
      <div class="mini" id="mini" hidden><span>기준 섬</span><canvas id="mcv" role="img" aria-label="아무것도 바꾸지 않은 기준 섬"></canvas></div>
    </div>
    <div class="btnrow">
      <button type="button" class="btn pri" id="play">▶ 기르기 시작</button>
      <button type="button" class="btn warn" id="kill">여우 모두 잡기</button>
      <span id="drow" class="btnrow" style="margin:0">
        <span class="seg" role="group" aria-label="가뭄 세기"><button type="button" class="btn" data-sev="1500">약한 가뭄</button><button type="button" class="btn" data-sev="200">센 가뭄</button></span>
        <button type="button" class="btn warn" id="dry">가뭄 8년 시작</button>
      </span>
      <span class="seg" role="group" aria-label="속도"><button type="button" class="btn" data-spd="1">느리게</button><button type="button" class="btn" data-spd="2">보통</button><button type="button" class="btn" data-spd="4">빠르게</button></span>
      <button type="button" class="btn" id="reset">처음부터</button>
      <button type="button" class="btn" id="result">결과 한 장 보기</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <aside class="card">
    <div id="pred"></div>
    <div id="vars" hidden></div>
    <div class="note" id="note"></div>
  </aside>
</div>

<div class="card gcard">
  <h2>개체수 기록 <span class="flash" id="flash"></span></h2>
  <div class="gr" id="gr"></div>
  <div class="legend">
    <span><i style="border-color:var(--d-blue)"></i>토끼(1차 소비자)</span>
    <span><i style="border-color:var(--p-orange);border-top-style:dashed"></i>여우(2차 소비자)</span>
    <span><i style="border-color:var(--d-green);border-top-width:8px;opacity:.5"></i>풀의 양(생산자)</span>
    <span id="legbase"><i style="border-color:var(--t2);border-top-style:dotted"></i>여우가 있을 때 토끼 평균</span>
    <span id="legref" hidden>흐린 선 = 기준 섬</span>
  </div>
  <div class="bars" id="bars"></div>
</div>

<div class="card" style="margin-top:14px">
  <h2>이 모형의 가정과 한계</h2>
  <ol class="limits" id="limits"></ol>
</div>

</div>
<div id="ovl"></div>
<p class="sr-only" id="readout"></p>
<div class="sr-only" id="live" aria-live="polite"></div>

<script src="../sims.js"></script>
<script src="../shared/nav.js" data-base=".." data-current="predprey"></script>
<script src="../shared/qr.js" data-base=".." data-current="predprey"></script>
<script src="sim.js"></script>
</body>
</html>
