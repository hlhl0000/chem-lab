<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개체군 생존 게임 — 우리 조 화면 | 케미랩</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
.tab-page{ padding:12px 0 28px; }
.tab-head{ margin-bottom:10px; }
.tab-title{ margin:0 0 2px; font-size:19px; color:var(--t1); font-weight:700; }
.tab-sub{ margin:0; font-size:12.5px; color:var(--t2); }
.tab-status{ font-size:11.5px; color:var(--t3); }
.pin-form{ display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
.pin-label{ font-size:13px; color:var(--t2); font-weight:600; }
.pin-input{
  font-family:inherit; font-size:30px; letter-spacing:.28em; text-align:center;
  width:100%; max-width:260px; min-height:56px; padding:6px 10px;
  border:2px solid var(--line); border-radius:10px; background:var(--panel); color:var(--t1);
  font-variant-numeric:tabular-nums;
}
.pin-btn{
  min-height:48px; padding:8px 22px; border-radius:9px; border:1px solid var(--accent);
  background:var(--accent); color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
}
.pin-error{ color:var(--d-red); font-size:12.5px; min-height:18px; margin:0; }
.pin-hint{ font-size:12px; color:var(--t3); margin:0; }
.tab-meta{ display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; margin-bottom:6px; }
.tab-team{ font-size:17px; font-weight:700; color:var(--t1); }
.tab-phase{ font-size:12.5px; color:var(--t2); }
.tab-card{
  border:2px solid var(--accent); border-radius:10px; padding:8px 10px; margin-bottom:8px; text-align:center;
}
.tab-card-kicker{ margin:0; font-size:11px; color:var(--accent); font-weight:700; }
.tab-card-name{ margin:2px 0; font-size:20px; font-weight:700; color:var(--t1); }
.tab-card-range{ margin:0; font-size:12.5px; color:var(--t2); }
.tab-canvas{ width:100%; height:auto; display:block; }
.tab-count{ font-size:20px; font-weight:700; color:var(--t1); font-variant-numeric:tabular-nums; }
.tab-note{ font-size:11.5px; color:var(--t3); margin:4px 0 0; }
</style>
</head>
<body>

<main class="wrap tab-page">
  <header class="tab-head">
    <h1 class="tab-title">우리 조 화면</h1>
    <p class="tab-sub">선생님 화면과 이어져 있습니다. <span class="tab-status" id="tabStatus">PIN을 넣으세요</span></p>
  </header>

  <section class="card" id="pinPane">
    <form class="pin-form" id="pinForm">
      <label class="pin-label" for="pinInput">선생님 화면에 뜬 우리 조 PIN 네 자리</label>
      <input class="pin-input" id="pinInput" type="text" inputmode="numeric" maxlength="4" autocomplete="off">
      <p class="pin-error" id="pinError"></p>
      <button class="pin-btn" type="submit">연결</button>
      <p class="pin-hint">같은 와이파이에 연결돼 있어야 합니다.</p>
    </form>
  </section>

  <section class="card" id="gamePane" style="display:none">
    <div class="tab-meta">
      <span class="tab-team" id="tabTeam">—</span>
      <span class="tab-phase" id="tabPhase">—</span>
      <span class="flexgap"></span>
      <span class="tab-count" id="tabCount">—</span>
    </div>
    <div id="tabCard"></div>
    <canvas class="tab-canvas" id="tabCanvas"
      aria-label="우리 조 개체군 — 원 안에 개체를 점으로 나타냅니다"></canvas>
    <p class="tab-note">점 하나가 개체 한 마리입니다. 자리는 개체마다 정해져 있고 바뀌지 않습니다. 털이 두꺼울수록 진하고 큽니다.</p>
    <table class="history-table">
      <thead class="history-head"><tr class="history-row">
        <th class="history-cell">라운드</th><th class="history-cell">환경</th><th class="history-cell">살아남은 마릿수</th>
      </tr></thead>
      <tbody class="history-body" id="tabHistory"></tbody>
    </table>
  </section>
</main>

<div class="site-foot">케미랩</div>

<script src="tablet.js?v=20260824a"></script>
</body>
</html>
